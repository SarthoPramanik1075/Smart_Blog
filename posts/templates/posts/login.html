{% extends 'posts/base.html' %}

{% block content %}

<h2>Login</h2>

{% if error %}

    <p style="color:red;">
        {{ error }}
    </p>

{% endif %}
<form method="POST">

    {% csrf_token %}

    <input 
        type="text"
        name="username"
        placeholder="Username"
    >

    <br><br>

    <input 
        type="password"
        name="password"
        placeholder="Password"
    >

    <br><br>

    <button>Login</button>
</form>

<p>
    <a href="{% url 'forgot_password' %}">
        Forgot Password?
    </a>
</p>

<p>
    Don't have an account? <a href="{% url 'register' %}">Register here</a>.
</p>

{% endblock %}
