{% extends 'posts/base.html' %}

{% block content %}
<h2>Forgot Password</h2>

{% if error %}

    <p style="color:red;">
        {{ error }}
    </p>

{% endif %}

<form method="post"
    {% csrf_token %}
>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <button type="submit">Send Reset Code</button>
</form>
{% endblock %}
