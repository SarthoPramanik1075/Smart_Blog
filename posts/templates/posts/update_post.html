{% extends 'posts/base.html' %}

{% block content %}

<h2>Update Post</h2>

<form method="POST">

    {% csrf_token %}

    <input 
        type="text"
        name="title"
        value="{{ post.title }}"
    >

    <br><br>

    <textarea name="content">{{ post.content }}</textarea>

    <br><br>

    <button>Update Post</button>

</form>

{% endblock %}
