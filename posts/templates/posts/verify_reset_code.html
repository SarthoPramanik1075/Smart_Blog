{% extends 'posts/base.html' %}
{% block content %}

<h2>Verify Reset Code</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <input type="text" name="code" placeholder="Enter reset code">
    <br><br>
    <button>Verify</button>
</form>

{% endblock %}
